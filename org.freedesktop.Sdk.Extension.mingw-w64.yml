id: org.freedesktop.Sdk.Extension.mingw-w64
branch: '26.08'
build-extension: true
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
separate-locales: false
sdk-extensions: []
build-options:
  prefix: /usr/lib/sdk/mingw-w64
  env:
    C_INCLUDE_PATH: /usr/lib/sdk/mingw-w64/include
    CPLUS_INCLUDE_PATH: /usr/lib/sdk/mingw-w64/include
  prepend-path: /usr/lib/sdk/mingw-w64/bin
  prepend-ld-library-path: /usr/lib/sdk/mingw-w64/lib
  prepend-pkg-config-path: /usr/lib/sdk/mingw-w64/lib/pkgconfig
  cflags: -O2 -g
  cflags-override: true
  cxxflags: -O2 -g
  cxxflags-override: true
  ldflags: -L/usr/lib/sdk/mingw-w64/lib
  ldflags-override: true
x-mingw-src: &mingw_src
  type: archive
  url: https://downloads.sourceforge.net/mingw-w64/mingw-w64-v14.0.0.tar.bz2
  sha256: 6eaf921d9eb987d3820b364ea9775bc19b965ec81490b6fdd716526c28e1995c
  x-checker-data:
    type: html
    url: https://sourceforge.net/projects/mingw-w64/rss
    version-pattern: <link>https://sourceforge.net/projects/mingw-w64/files/mingw-w64/mingw-w64-release/mingw-w64-v([\d\.]+).tar.bz2/download</link>
    url-template: https://downloads.sourceforge.net/mingw-w64/mingw-w64-v$version.tar.bz2
    is-main-source: true
modules:

  # Binutils

  - name: binutils-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
    config-opts: &binutils_config_opts
      - --with-system-zlib
      - --enable-lto
      - --enable-plugins
      - --enable-deterministic-archives
      - --disable-multilib
      - --disable-nls
      - --disable-werror
    install-rule: install-strip
    builddir: true
    sources: &binutils_sources
      - type: archive
        url: https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.gz
        sha256: 15f5abd0db9cf8ea116f516a9ce12bc1cefef491ef9e50942868093d8f92a6f3

  - name: binutils-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
    config-opts: *binutils_config_opts
    install-rule: install-strip
    builddir: true
    sources: *binutils_sources

  # Headers

  - name: mingw-w64-headers-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
        - --prefix=${FLATPAK_DEST}/x86_64-w64-mingw32
    config-opts: &mingw_headers_config_opts
      - --enable-sdk=all
      - --enable-secure-api
    builddir: true
    subdir: mingw-w64-headers
    sources:
      - *mingw_src

  - name: mingw-w64-headers-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
        - --prefix=${FLATPAK_DEST}/i686-w64-mingw32
    config-opts: *mingw_headers_config_opts
    builddir: true
    subdir: mingw-w64-headers
    sources:
      - *mingw_src

  # GCC dependencies

  - name: mpc
    config-opts:
      - --disable-shared
      - --enable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mpc/mpc-1.4.1.tar.xz
        sha256: 91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931

  - name: isl
    config-opts:
      - --disable-shared
      - --enable-static
    sources:
      - type: archive
        url: https://libisl.sourceforge.io/isl-0.28.tar.gz
        sha256: 318549dd36989046da2b0feaea7fe5575c4448c28c0b97d3117403a88988e756

  # GCC bootstrap

  - name: gcc-bootstrap-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
    config-opts: &gcc_config_opts
      - --disable-multilib
      - --enable-checking=release
      - --enable-languages=c,c++,lto
      - --with-system-zlib
      - --enable-shared
      - --enable-static
      - --enable-threads=posix
      - --enable-libstdcxx-time=yes
      - --enable-libstdcxx-filesystem-ts=yes
      - --enable-fully-dynamic-string
      - --enable-libgomp
      - --enable-lto
      - --with-isl
      - --enable-cloog-backend=isl
      - --disable-sjlj-exceptions
      - --with-dwarf2
    make-args:
      - all-gcc
    install-rule: install-gcc
    builddir: true
    sources: &gcc_sources
      - type: archive
        url: https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz
        sha256: e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e

  - name: gcc-bootstrap-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
    config-opts: *gcc_config_opts
    make-args:
      - all-gcc
    install-rule: install-gcc
    builddir: true
    sources: *gcc_sources

  # MinGW CRT

  - name: mingw-w64-crt-x86_64
    build-options:
      config-opts:
        - --host=x86_64-w64-mingw32
        - --target=x86_64-w64-mingw32
        - --prefix=${FLATPAK_DEST}/x86_64-w64-mingw32
        - --disable-lib32
    builddir: true
    subdir: mingw-w64-crt
    sources:
      - *mingw_src

  - name: mingw-w64-crt-i686
    build-options:
      config-opts:
        - --host=i686-w64-mingw32
        - --target=i686-w64-mingw32
        - --prefix=${FLATPAK_DEST}/i686-w64-mingw32
    builddir: true
    subdir: mingw-w64-crt
    sources:
      - *mingw_src

  # MinGW winpthreads

  - name: mingw-w64-winpthreads-x86_64
    build-options:
      config-opts:
        - --host=x86_64-w64-mingw32
        - --prefix=${FLATPAK_DEST}/x86_64-w64-mingw32
    config-opts: &mingw_winpthreads_config_opts
      - --enable-static
      - --enable-shared
    builddir: true
    subdir: mingw-w64-libraries/winpthreads
    sources:
      - *mingw_src

  - name: mingw-w64-winpthreads-i686
    build-options:
      config-opts:
        - --host=i686-w64-mingw32
        - --prefix=${FLATPAK_DEST}/i686-w64-mingw32
    config-opts: *mingw_winpthreads_config_opts
    builddir: true
    subdir: mingw-w64-libraries/winpthreads
    sources:
      - *mingw_src

  # GCC full

  - name: gcc-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
    config-opts: *gcc_config_opts
    ensure-writable:
      - /lib/gcc/*/*/install-tools/*.conf
    install-rule: install-strip
    builddir: true
    sources: *gcc_sources

  - name: gcc-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
    config-opts: *gcc_config_opts
    ensure-writable:
      - /lib/gcc/*/*/install-tools/*.conf
    install-rule: install-strip
    builddir: true
    sources: *gcc_sources

  # Tools

  - name: mingw-w64-gendef
    subdir: mingw-w64-tools/gendef
    sources:
      - *mingw_src

  - name: mingw-w64-genidl
    subdir: mingw-w64-tools/genidl
    sources:
      - *mingw_src

  - name: mingw-w64-genpeimg
    subdir: mingw-w64-tools/genpeimg
    sources:
      - *mingw_src

  - name: mingw-w64-widl-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
        - --program-prefix=x86_64-w64-mingw32-
    builddir: true
    subdir: mingw-w64-tools/widl
    sources: &mingw_widl_src
      - *mingw_src

  - name: mingw-w64-widl-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
        - --program-prefix=i686-w64-mingw32-
    builddir: true
    subdir: mingw-w64-tools/widl
    sources: *mingw_widl_src

  # Flatpak bundle

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.mingw-w64.metainfo.xml
