id: org.freedesktop.Sdk.Extension.mingw-w64
branch: '24.08'
build-extension: true
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Sdk
runtime-version: '24.08'
separate-locales: false
sdk-extensions: []
build-options:
  prefix: /usr/lib/sdk/mingw-w64
  env:
    C_INCLUDE_PATH: /usr/lib/sdk/mingw-w64/include
    CPLUS_INCLUDE_PATH: /usr/lib/sdk/mingw-w64/include
  prepend-path: /usr/lib/sdk/mingw-w64/bin
  prepend-ld-library-path: /usr/lib/sdk/mingw-w64/lib
  prepend-pkg-config-path: /usr/lib/sdk/mingw-w64/lib/pkgconfig
  cflags: -O2 -g
  cflags-override: true
  cxxflags: -O2 -g
  cxxflags-override: true
  ldflags: -L/usr/lib/sdk/mingw-w64/lib
  ldflags-override: true
x-mingw-src: &mingw_src
  type: archive
  url: https://downloads.sourceforge.net/mingw-w64/mingw-w64-v12.0.0.tar.bz2
  sha256: cc41898aac4b6e8dd5cffd7331b9d9515b912df4420a3a612b5ea2955bbeed2f
  x-checker-data:
    type: html
    url: https://sourceforge.net/projects/mingw-w64/rss
    version-pattern: <link>https://sourceforge.net/projects/mingw-w64/files/mingw-w64/mingw-w64-release/mingw-w64-v([\d\.]+).tar.bz2/download</link>
    url-template: https://downloads.sourceforge.net/mingw-w64/mingw-w64-v$version.tar.bz2
    is-main-source: true
modules:

  # Binutils

  - name: binutils-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
    config-opts: &binutils_config_opts
      - --with-system-zlib
      - --enable-lto
      - --enable-plugins
      - --enable-deterministic-archives
      - --disable-nls
      - --disable-werror
    install-rule: install-strip
    builddir: true
    sources: &binutils_sources
      - type: archive
        url: https://ftp.gnu.org/gnu/binutils/binutils-2.43.1.tar.gz
        sha256: e4c38b893f590853fbe276a6b8a1268101e35e61849a07f6ee97b5ecc97fbff8

  - name: binutils-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
    config-opts: *binutils_config_opts
    install-rule: install-strip
    builddir: true
    sources: *binutils_sources

  # Headers

  - name: mingw-w64-headers-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
        - --prefix=${FLATPAK_DEST}/x86_64-w64-mingw32
    config-opts: &mingw_headers_config_opts
      - --enable-sdk=all
      - --enable-secure-api
    builddir: true
    subdir: mingw-w64-headers
    sources:
      - *mingw_src

  - name: mingw-w64-headers-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
        - --prefix=${FLATPAK_DEST}/i686-w64-mingw32
    config-opts: *mingw_headers_config_opts
    builddir: true
    subdir: mingw-w64-headers
    sources:
      - *mingw_src

  # GCC dependencies

  - name: mpc
    config-opts:
      - --disable-shared
      - --enable-static
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz
        sha256: ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8
    modules:

      - name: mpfr
        config-opts:
          - --disable-shared
          - --enable-static
        sources:
          - type: archive
            url: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz
            sha256: 277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2

  - name: isl
    config-opts:
      - --disable-shared
      - --enable-static
    sources:
      - type: archive
        url: https://libisl.sourceforge.io/isl-0.27.tar.gz
        sha256: 7a1a3f04d57c7c72fee5a6148cd3b02b05db6a6dd9a58def7bdc00972a6301c3

  # GCC bootstrap

  - name: gcc-bootstrap-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
    config-opts: &gcc_config_opts
      - --disable-multilib
      - --enable-languages=c,c++,lto
      - --with-system-zlib
      - --enable-shared
      - --enable-static
      - --enable-threads=posix
      - --enable-libstdcxx-time=yes
      - --enable-libstdcxx-filesystem-ts=yes
      - --enable-fully-dynamic-string
      - --enable-libgomp
      - --enable-lto
      - --with-isl
      - --enable-cloog-backend=isl
      - --disable-sjlj-exceptions
      - --with-dwarf2
    make-args:
      - all-gcc
    install-rule: install-gcc
    builddir: true
    sources: &gcc_sources
      - type: archive
        url: https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz
        sha256: a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9
      - type: patch
        paths:
          - patches/gcc/0020-libgomp-Don-t-hard-code-MS-printf-attributes.patch

  - name: gcc-bootstrap-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
    config-opts: *gcc_config_opts
    make-args:
      - all-gcc
    install-rule: install-gcc
    builddir: true
    sources: *gcc_sources

  # MinGW CRT

  - name: mingw-w64-crt-x86_64
    build-options:
      config-opts:
        - --host=x86_64-w64-mingw32
        - --target=x86_64-w64-mingw32
        - --prefix=${FLATPAK_DEST}/x86_64-w64-mingw32
        - --disable-lib32
    builddir: true
    subdir: mingw-w64-crt
    sources:
      - *mingw_src

  - name: mingw-w64-crt-i686
    build-options:
      config-opts:
        - --host=i686-w64-mingw32
        - --target=i686-w64-mingw32
        - --prefix=${FLATPAK_DEST}/i686-w64-mingw32
    builddir: true
    subdir: mingw-w64-crt
    sources:
      - *mingw_src

  # MinGW winpthreads

  - name: mingw-w64-winpthreads-x86_64
    build-options:
      config-opts:
        - --host=x86_64-w64-mingw32
        - --prefix=${FLATPAK_DEST}/x86_64-w64-mingw32
    config-opts: &mingw_winpthreads_config_opts
      - --enable-static
      - --enable-shared
    builddir: true
    subdir: mingw-w64-libraries/winpthreads
    sources:
      - *mingw_src

  - name: mingw-w64-winpthreads-i686
    build-options:
      config-opts:
        - --host=i686-w64-mingw32
        - --prefix=${FLATPAK_DEST}/i686-w64-mingw32
    config-opts: *mingw_winpthreads_config_opts
    builddir: true
    subdir: mingw-w64-libraries/winpthreads
    sources:
      - *mingw_src

  # GCC full

  - name: gcc-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
    config-opts: *gcc_config_opts
    ensure-writable:
      - /lib/gcc/*/*/install-tools/*.conf
    install-rule: install-strip
    builddir: true
    sources: *gcc_sources

  - name: gcc-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
    config-opts: *gcc_config_opts
    ensure-writable:
      - /lib/gcc/*/*/install-tools/*.conf
    install-rule: install-strip
    builddir: true
    sources: *gcc_sources

  # Tools

  - name: mingw-w64-gendef
    subdir: mingw-w64-tools/gendef
    sources:
      - *mingw_src

  - name: mingw-w64-genidl
    subdir: mingw-w64-tools/genidl
    sources:
      - *mingw_src

  - name: mingw-w64-genpeimg
    subdir: mingw-w64-tools/genpeimg
    sources:
      - *mingw_src

  - name: mingw-w64-widl-x86_64
    build-options:
      config-opts:
        - --target=x86_64-w64-mingw32
        - --program-prefix=x86_64-w64-mingw32-
    builddir: true
    subdir: mingw-w64-tools/widl
    sources: &mingw_widl_src
      - *mingw_src

  - name: mingw-w64-widl-i686
    build-options:
      config-opts:
        - --target=i686-w64-mingw32
        - --program-prefix=i686-w64-mingw32-
    builddir: true
    subdir: mingw-w64-tools/widl
    sources: *mingw_widl_src

  # Flatpak bundle

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.mingw-w64.metainfo.xml
